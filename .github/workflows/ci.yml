name: CI Frontend

on:
  push:
    branches: [revamp, main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit, semua workspace)
        run: |
          set -e
          for pkg in packages/api-client packages/ui apps/auth apps/wallet apps/credit apps/container; do
            echo "::group::tsc $pkg"
            npx tsc --noEmit -p "$pkg/tsconfig.json"
            echo "::endgroup::"
          done

      - name: Lint (eslint, aplikasi yang dipakai)
        run: |
          set -e
          for app in apps/auth apps/wallet apps/credit apps/container; do
            echo "::group::eslint $app"
            npm run lint -w "$app"
            echo "::endgroup::"
          done

      - name: Build semua workspace Next.js
        run: npm run build
